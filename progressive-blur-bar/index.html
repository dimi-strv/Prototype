<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progressive blur bar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100vh;
    background: #e9e9ee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Phone-sized frame so the demo looks like an app screen */
  .screen {
    position: relative;
    width: 380px;
    height: 680px;
    overflow: hidden;
    border-radius: 24px;
    background: #fff;
    box-shadow: 0 10px 40px rgba(0,0,0,.18);
  }

  /* The scrollable list. Top padding = bar height so the first item starts below the bar. */
  .list {
    height: 100%;
    overflow-y: auto;
    padding: 96px 16px 24px;
    display: grid;
    gap: 12px;
    align-content: start;
  }

  .card {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 12px;
    align-items: center;
    padding: 12px;
    border-radius: 14px;
    background: var(--c);
    color: #fff;
  }
  .card .dot {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,.3);
    display: grid; place-items: center;
    font-weight: 700; font-size: 20px;
  }
  .card h3 { margin: 0 0 2px; font-size: 16px; }
  .card p  { margin: 0; font-size: 13px; opacity: .9; }

  /* ---------- Progressive blur bar ---------- */
  .bar {
    position: absolute;
    inset: 0 0 auto 0;          /* top, left, right */
    height: 96px;
    pointer-events: none;       /* let scroll/touch pass through */
  }

  /* Each layer blurs the content behind it, but is masked to its own band.
     --i = band index (0 = bottom edge of the bar, 7 = top edge).
     Bands overlap, so blurs add up smoothly: ~0px at the bottom -> 26px at the top. */
  .bar .blur {
    position: absolute;
    inset: 0;
    -webkit-backdrop-filter: blur(var(--blur));
            backdrop-filter: blur(var(--blur));
    --mask: linear-gradient(
      to top,
      transparent calc(var(--i) * 12.5%),
      #000        calc((var(--i) + 1) * 12.5%),
      #000        calc((var(--i) + 2) * 12.5%),
      transparent calc((var(--i) + 3) * 12.5%)
    );
    -webkit-mask-image: var(--mask);
            mask-image: var(--mask);
  }

  /* Optional soft white tint so the title stays readable over busy content */
  .bar::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,1), rgba(255,255,255,0));
  }

  .bar h1 {
    position: absolute;
    z-index: 1;                 /* above the blur layers, so the title itself isn't blurred */
    margin: 0;
    left: 20px; top: 24px;
    font-size: 22px;
    color: #111;
  }

  /* Fallback: no backdrop-filter support -> plain white fade instead of blur */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .bar .blur { display: none; }
    .bar::after { background: linear-gradient(to bottom, #fff 30%, rgba(255,255,255,0)); }
  }

  /* Respect users who ask for less transparency */
  @media (prefers-reduced-transparency: reduce) {
    .bar .blur { display: none; }
    .bar::after { background: linear-gradient(to bottom, #fff 60%, rgba(255,255,255,0)); }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="list" id="list"></div>

  <div class="bar" aria-hidden="false">
    <div class="blur" style="--i:0; --blur:0.5px"></div>
    <div class="blur" style="--i:1; --blur:1px"></div>
    <div class="blur" style="--i:2; --blur:2px"></div>
    <div class="blur" style="--i:3; --blur:4px"></div>
    <div class="blur" style="--i:4; --blur:8px"></div>
    <div class="blur" style="--i:5; --blur:13px"></div>
    <div class="blur" style="--i:6; --blur:19px"></div>
    <div class="blur" style="--i:7; --blur:26px"></div>
    <h1>Activities</h1>
  </div>
</div>

<script>
  // Demo content only
  const colors = ["#fc4c02", "#2a7de1", "#16a085", "#8e44ad", "#e67e22", "#c0392b", "#2c3e50"];
  const titles = ["Morning Run", "Lunch Ride", "Evening Walk", "Trail Run", "Swim Session", "Hill Repeats", "Recovery Jog"];
  const list = document.getElementById("list");
  for (let i = 0; i < 30; i++) {
    const c = colors[i % colors.length];
    list.insertAdjacentHTML("beforeend", `
      <div class="card" style="--c:${c}">
        <div class="dot">${i + 1}</div>
        <div>
          <h3>${titles[i % titles.length]}</h3>
          <p>${(5 + (i * 7) % 20).toFixed(1)} km · ${30 + (i * 11) % 60} min</p>
        </div>
      </div>`);
  }
</script>
</body>
</html>
